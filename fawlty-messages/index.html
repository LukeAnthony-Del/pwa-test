<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#6f2430" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3d1820" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fawlty Messages sends direct messages and group chats through ntfy.sh. Each device gets a code." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fawlty Messages" />
    <title>Fawlty Messages</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <section id="view-list" class="view">
        <header class="top">
          <h1><span class="mark">Fawlty</span><small>Messages</small></h1>
          <span id="dot" class="dot" title="Connecting"></span>
          <button type="button" class="icon-btn primary" data-action="new" data-icon="plus" aria-label="New chat"></button>
        </header>
        <div id="install" class="install" hidden>
          <p>Install Fawlty Messages on this phone.</p>
          <button type="button" class="btn" data-action="install-go">Install</button>
          <button type="button" class="icon-btn" data-action="install-hide" data-icon="close" aria-label="Dismiss"></button>
        </div>
        <p id="net" class="net" role="status" hidden></p>
        <div class="tag">
          <button type="button" class="tag-main" data-action="details">
            <span>Your code</span>
            <strong id="my-code">····-····</strong>
          </button>
          <button type="button" class="text-btn" data-action="copy-code">Copy</button>
          <button type="button" class="text-btn" data-action="share-code">Share</button>
        </div>
        <label class="name-line">Your name
          <input id="my-name" maxlength="32" placeholder="What people should call you" autocomplete="nickname" enterkeyhint="done" />
        </label>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search" aria-label="Search chats" autocomplete="off" enterkeyhint="search" />
        </div>
        <div id="list" class="list"></div>
      </section>

      <section id="view-chat" class="view" hidden>
        <header class="top chat-top">
          <button type="button" class="icon-btn" data-action="back" data-icon="back" aria-label="Back"></button>
          <button type="button" id="chat-open" data-action="open-info">
            <strong id="chat-name"></strong>
            <small id="chat-sub"></small>
          </button>
          <button type="button" class="icon-btn" data-action="chat-menu" data-icon="menu" aria-label="Chat options"></button>
        </header>
        <div id="log"></div>
        <button type="button" id="jump" class="jump" data-action="jump-bottom" hidden>New messages</button>
        <div id="actions" class="actions" hidden>
          <div id="reacts" class="reacts"></div>
          <div class="act-row">
            <button type="button" id="act-reply" data-action="reply">Reply</button>
            <button type="button" id="act-forward" data-action="forward">Forward</button>
            <button type="button" id="act-copy" data-action="copy-msg">Copy</button>
            <button type="button" id="act-retry" data-action="retry-pick" hidden>Retry</button>
            <button type="button" id="act-quote" data-action="jump-quote" hidden>Show quoted</button>
            <button type="button" id="act-delete" data-action="delete-me">Delete for me</button>
            <button type="button" id="act-delete-all" data-action="delete-all">Delete for everyone</button>
          </div>
        </div>
        <div id="replying" class="replying" hidden>
          <div>
            <strong id="reply-name"></strong>
            <span id="reply-text"></span>
          </div>
          <button type="button" class="icon-btn" data-action="cancel-reply" data-icon="close" aria-label="Cancel reply"></button>
        </div>
        <div id="emoji-panel" class="emoji-panel" hidden></div>
        <form id="composer" class="composer">
          <button type="button" class="emoji-btn" data-action="emoji" data-icon="emoji" aria-label="Emoji"></button>
          <textarea id="draft" rows="1" placeholder="Message" aria-label="Message" maxlength="2000"></textarea>
          <button type="submit" id="send" class="send" data-icon="send" aria-label="Send" disabled></button>
        </form>
        <div id="locked" class="locked" hidden>
          <p id="locked-text"></p>
          <button type="button" class="btn" data-action="rejoin">Join again</button>
        </div>
      </section>

      <section id="view-info" class="view" hidden>
        <header class="top">
          <button type="button" class="icon-btn" data-action="back" data-icon="back" aria-label="Back"></button>
          <h1><span class="mark">Details</span></h1>
        </header>
        <div id="info" class="info"></div>
      </section>

      <div id="sheet" class="sheet" hidden>
        <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div id="sheet-body"></div>
        </div>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <noscript>Fawlty Messages needs JavaScript to send and receive chats.</noscript>
    <script src="app.js"></script>
  </body>
</html>
