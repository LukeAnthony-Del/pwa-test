<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TikTok" />
    <title>TikTok</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(env(safe-area-inset-top) + 52px) 24px calc(env(safe-area-inset-bottom) + 28px);
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: -0.2px;
      }
      .dots {
        display: flex;
        gap: 20px;
        margin: 22px 0 48px;
        min-height: 14px;
      }
      .dots span {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        background: transparent;
      }
      .dots span.on { background: #fff; }
      .pad.shake { animation: shake .42s ease; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-12px); }
        40% { transform: translateX(12px); }
        60% { transform: translateX(-8px); }
        80% { transform: translateX(8px); }
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 76px);
        gap: 16px 28px;
        justify-content: center;
      }
      .key {
        width: 76px;
        height: 76px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 4px;
        -webkit-tap-highlight-color: transparent;
      }
      .key:active { background: rgba(255, 255, 255, 0.45); }
      .key b {
        font-size: 32px;
        font-weight: 400;
        line-height: 1;
      }
      .key small {
        margin-top: 2px;
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 500;
        height: 12px;
      }
      .blank { background: transparent; pointer-events: none; }
      .delete {
        align-self: center;
        justify-self: center;
        border: 0;
        background: transparent;
        color: #fff;
        font-size: 17px;
        padding: 12px;
        cursor: pointer;
      }
      .install {
        margin-top: auto;
        border: 0;
        background: transparent;
        color: #0a84ff;
        font: inherit;
        font-size: 17px;
        padding: 8px;
        cursor: pointer;
      }
      .install[hidden] { display: none; }
    </style>
  </head>
  <body>
    <img class="icon" src="icon-192.png" alt="" />
    <h1>Enter Passcode</h1>
    <div class="dots" id="dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="pad" id="pad">
      <button class="key" data-n="1"><b>1</b><small></small></button>
      <button class="key" data-n="2"><b>2</b><small>ABC</small></button>
      <button class="key" data-n="3"><b>3</b><small>DEF</small></button>
      <button class="key" data-n="4"><b>4</b><small>GHI</small></button>
      <button class="key" data-n="5"><b>5</b><small>JKL</small></button>
      <button class="key" data-n="6"><b>6</b><small>MNO</small></button>
      <button class="key" data-n="7"><b>7</b><small>PQRS</small></button>
      <button class="key" data-n="8"><b>8</b><small>TUV</small></button>
      <button class="key" data-n="9"><b>9</b><small>WXYZ</small></button>
      <div class="key blank"></div>
      <button class="key" data-n="0"><b>0</b><small></small></button>
      <button class="delete" type="button" id="delete">Delete</button>
    </div>
    <button class="install" id="install" hidden>Add to Home Screen</button>
    <script>
      const PIN = "2013";
      const TIKTOK = "https://www.tiktok.com";
      const dots = [...document.querySelectorAll("#dots span")];
      const pad = document.getElementById("pad");
      const installBtn = document.getElementById("install");
      let value = "";
      let locked = false;
      let deferredPrompt;

      function paint() {
        dots.forEach((dot, i) => dot.classList.toggle("on", i < value.length));
      }

      function openTikTok() {
        window.location.replace(TIKTOK);
      }

      function check() {
        if (value === PIN) {
          locked = true;
          setTimeout(openTikTok, 120);
          return;
        }
        locked = true;
        pad.classList.remove("shake");
        void pad.offsetWidth;
        pad.classList.add("shake");
        setTimeout(() => {
          value = "";
          locked = false;
          paint();
        }, 420);
      }

      pad.addEventListener("click", (event) => {
        const key = event.target.closest("[data-n]");
        if (!key || locked || value.length >= 4) return;
        value += key.dataset.n;
        paint();
        if (value.length === 4) check();
      });

      document.getElementById("delete").addEventListener("click", () => {
        if (locked) return;
        value = value.slice(0, -1);
        paint();
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.hidden = false;
      });
      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      });
    </script>
  </body>
</html>
