<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TikTok" />
    <title>TikTok</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-top: env(safe-area-inset-top);
      }
      .wrap {
        text-align: center;
        max-width: 320px;
      }
      img.logo {
        width: 120px;
        height: 120px;
        border-radius: 28px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #b3b3b3;
        font-size: 15px;
      }
      .btn {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 10px;
        text-decoration: none;
      }
      .open {
        background: #fe2c55;
        color: #fff;
      }
      .install {
        background: #25f4ee;
        color: #000;
      }
      .install[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="icon-512.png" alt="TikTok" />
      <h1>TikTok</h1>
      <p>Install this on your phone, then tap the icon to open TikTok on the web.</p>
      <button class="btn install" id="install" hidden>Install app</button>
      <a class="btn open" id="open" href="https://www.tiktok.com">Open TikTok</a>
    </div>
    <script>
      const TIKTOK = "https://www.tiktok.com";
      const installBtn = document.getElementById("install");
      let deferredPrompt;

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.hidden = false;
      });

      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      });

      const standalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (standalone) {
        window.location.replace(TIKTOK);
      }
    </script>
  </body>
</html>
