<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f8a4c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gear" />
    <title>Pickleball Gear</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
      :root {
        --green: #1f8a4c;
        --green-dark: #166b3a;
        --green-soft: #e8f6ee;
        --white: #ffffff;
        --ink: #14301f;
        --muted: #5b7464;
        --line: #d7e6db;
        --tab: 72px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--white);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        overscroll-behavior-y: contain;
      }
      body {
        padding-top: env(safe-area-inset-top);
      }
      .app {
        min-height: 100vh;
        padding-bottom: calc(var(--tab) + env(safe-area-inset-bottom));
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--white);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--white);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .page {
        display: none;
        padding: 16px 18px 24px;
      }
      .page.is-active { display: block; }
      h2 { margin: 0 0 14px; font-size: 22px; color: var(--green-dark); }
      .form, .stack { display: grid; gap: 12px; }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      input, select, textarea {
        font: inherit;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--white);
        color: var(--ink);
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 14px;
        font: inherit;
        font-weight: 700;
        background: var(--green);
        color: var(--white);
        cursor: pointer;
      }
      .btn[hidden] { display: none; }
      .card {
        background: var(--green-soft);
        border-radius: 14px;
        padding: 14px;
      }
      .card + .card { margin-top: 10px; }
      .card strong { display: block; }
      .card span { color: var(--muted); font-size: 13px; }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .stat p { margin: 0; color: var(--muted); font-size: 12px; }
      .stat b { display: block; margin-top: 6px; font-size: 22px; color: var(--green-dark); }
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: var(--white);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 3;
      }
      .tabs button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 8px 4px 6px;
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        display: grid;
        justify-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .tabs button.is-active { color: var(--green); }
      .tabs svg { width: 24px; height: 24px; }
      .empty { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <img src="icon-192.png" alt="App logo" />
        <div>
          <h1>Pickleball Gear</h1>
          <p>Bookings · equipment · money</p>
        </div>
      </header>

      <section class="page is-active" id="booking">
        <h2>Add Booking</h2>
        <form id="booking-form" class="form">
          <label>Customer<input name="customer" required placeholder="Name" /></label>
          <label>Date & time<input type="datetime-local" name="when" required /></label>
          <label>Equipment
            <select name="equipment">
              <option>Paddle rental</option>
              <option>Ball pack</option>
              <option>Net</option>
              <option>Court time</option>
            </select>
          </label>
          <label>Amount ($)<input type="number" name="amount" min="0" step="0.01" value="8" required /></label>
          <label>Notes<input name="notes" placeholder="Court, duration…" /></label>
          <button class="btn" type="submit">Save booking</button>
        </form>
        <div id="booking-list"></div>
      </section>

      <section class="page" id="equipment">
        <h2>Equipment Log</h2>
        <div id="equipment-list"></div>
      </section>

      <section class="page" id="purchase">
        <h2>New Purchase</h2>
        <form id="purchase-form" class="form">
          <label>Item<input name="item" required placeholder="Paddles, balls, bags…" /></label>
          <label>Amount ($)<input type="number" name="amount" min="0" step="0.01" required /></label>
          <label>Date<input type="date" name="when" required /></label>
          <label>Notes<input name="notes" placeholder="Supplier, qty…" /></label>
          <button class="btn" type="submit">Save purchase</button>
        </form>
        <div id="purchase-list"></div>
      </section>

      <section class="page" id="finance">
        <h2>Financial Standing</h2>
        <div class="stats">
          <div class="stat"><p>Booking income</p><b id="inc-bookings">$0.00</b></div>
          <div class="stat"><p>Purchases</p><b id="inc-purchases">$0.00</b></div>
          <div class="stat"><p>Standing</p><b id="inc-net">$0.00</b></div>
          <div class="stat"><p>Open bookings</p><b id="inc-count">0</b></div>
        </div>
        <button class="btn" id="install" hidden>Install app</button>
        <p class="empty" id="status"></p>
      </section>

      <nav class="tabs" aria-label="Main">
        <button class="is-active" data-tab="booking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" /></svg>
          Add Booking
        </button>
        <button data-tab="equipment">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 4h7.2c1.4 0 2.2.9 2.2 2.1V14c0 3-2.4 4.6-5.1 4.6H9.2C6.7 18.6 5 17 5 14.4V6.2C5 4.9 5.8 4 7 4z" opacity=".9" />
            <rect x="14.2" y="15.2" width="2.1" height="6.2" rx=".7" transform="rotate(-38 15.2 18.3)" />
            <circle cx="17.6" cy="7.2" r="3.1" fill="#1f8a4c" />
            <circle cx="17.6" cy="7.2" r="1.1" fill="#fff" />
            <circle cx="7.8" cy="19.4" r="2.2" />
            <circle cx="7.8" cy="19.4" r=".7" fill="#fff" />
          </svg>
          Equipment Log
        </button>
        <button data-tab="purchase">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <circle cx="12" cy="12" r="2.4" />
            <path d="M7 6V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1" />
          </svg>
          New Purchase
        </button>
        <button data-tab="finance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="5" width="16" height="14" rx="2" />
            <path d="M8 10h8M8 14h5" />
            <path d="M16.2 16.2l1.3 1.3 2.3-2.5" />
          </svg>
          Financial Standing
        </button>
      </nav>
    </div>
    <script>
      const KEY = "pickleball-gear-app-v1";
      const defaultGear = [
        { name: "Paddles", qty: 12, notes: "In shed" },
        { name: "Outdoor balls", qty: 40, notes: "Yellow" },
        { name: "Nets", qty: 2, notes: "Court 1 & 2" },
      ];
      const load = () => {
        try { return JSON.parse(localStorage.getItem(KEY)) || { bookings: [], purchases: [], equipment: defaultGear }; }
        catch { return { bookings: [], purchases: [], equipment: defaultGear }; }
      };
      const save = (state) => localStorage.setItem(KEY, JSON.stringify(state));
      let state = load();
      if (!state.equipment) state.equipment = defaultGear;

      const money = (n) => `$${Number(n || 0).toFixed(2)}`;
      const formatWhen = (iso) => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

      const pages = document.querySelectorAll(".page");
      const tabs = document.querySelectorAll(".tabs button");
      tabs.forEach((btn) => {
        btn.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.toggle("is-active", t === btn));
          pages.forEach((p) => p.classList.toggle("is-active", p.id === btn.dataset.tab));
        });
      });

      function renderList(id, rows, empty) {
        document.getElementById(id).innerHTML = rows.length
          ? rows.map((row) => `<article class="card"><strong>${row.title}</strong><span>${row.detail}</span></article>`).join("")
          : `<p class="empty">${empty}</p>`;
      }

      function render() {
        renderList(
          "booking-list",
          [...state.bookings].reverse().map((b) => ({
            title: `${b.customer} · ${money(b.amount)}`,
            detail: `${b.equipment} · ${formatWhen(b.when)}${b.notes ? " · " + b.notes : ""}`,
          })),
          "No bookings yet."
        );
        renderList(
          "equipment-list",
          state.equipment.map((item) => ({
            title: `${item.name} · ${item.qty}`,
            detail: item.notes || "On hand",
          })),
          "No equipment logged."
        );
        renderList(
          "purchase-list",
          [...state.purchases].reverse().map((p) => ({
            title: `${p.item} · ${money(p.amount)}`,
            detail: `${p.when}${p.notes ? " · " + p.notes : ""}`,
          })),
          "No purchases yet."
        );
        const income = state.bookings.reduce((s, b) => s + Number(b.amount), 0);
        const spent = state.purchases.reduce((s, p) => s + Number(p.amount), 0);
        document.getElementById("inc-bookings").textContent = money(income);
        document.getElementById("inc-purchases").textContent = money(spent);
        document.getElementById("inc-net").textContent = money(income - spent);
        document.getElementById("inc-count").textContent = String(state.bookings.length);
      }

      document.getElementById("booking-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const f = event.target;
        state.bookings.push({
          customer: f.customer.value.trim(),
          when: f.when.value,
          equipment: f.equipment.value,
          amount: Number(f.amount.value),
          notes: f.notes.value.trim(),
        });
        save(state);
        f.reset();
        render();
      });

      document.getElementById("purchase-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const f = event.target;
        state.purchases.push({
          item: f.item.value.trim(),
          amount: Number(f.amount.value),
          when: f.when.value,
          notes: f.notes.value.trim(),
        });
        save(state);
        f.reset();
        render();
      });

      const bookingWhen = document.querySelector('#booking-form [name="when"]');
      const purchaseWhen = document.querySelector('#purchase-form [name="when"]');
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      bookingWhen.value = now.toISOString().slice(0, 16);
      purchaseWhen.value = now.toISOString().slice(0, 10);

      render();

      const status = document.getElementById("status");
      const installBtn = document.getElementById("install");
      let deferredPrompt;
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.hidden = false;
      });
      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      });
      if (window.matchMedia("(display-mode: standalone)").matches) {
        status.textContent = "Running as installed app.";
      }
    </script>
  </body>
</html>
